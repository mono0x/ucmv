name: Release
on:
  push:
    tags:
      - v*

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
