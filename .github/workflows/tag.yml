name: Tag
# Called from CI after all checks pass on main, so that only the exact commit that passed CI is tagged even if the release pull request was behind main when merged.
on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      # Tags created with GITHUB_TOKEN do not trigger workflows, so create the tag as the app to start the Release workflow.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create a tag for a new version
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            echo "${tag} already exists"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
