name: Tag
on:
  workflow_dispatch:

concurrency:
  group: tag
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version number uses the total commit count from git rev-list.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.6
          install_args: rust
      # Tags pushed with GITHUB_TOKEN do not trigger workflows, so push as the app to start the Release workflow.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Update version and create tag
        run: |
          date=$(TZ=Asia/Tokyo date +%Y%m%d)
          count=$(git rev-list --count HEAD)
          version="0.${date}.${count}"
          sed -i "s/^version = .*/version = \"${version}\"/" Cargo.toml
          cargo update --workspace
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Bump version to ${version}"
          git tag "v${version}"
          gh auth setup-git
          git push --atomic origin HEAD:main "v${version}"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
