name: Release build
# A reusable workflow so that provenance is signed by this workflow rather than its caller (SLSA Build Level 3).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions: {}

jobs:
  build:
    # The Apple SDK is needed to cross-compile the macOS targets.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MISE_ENV: release
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.6
          cache: false
      - run: goreleaser check
      - run: goreleaser release --skip=publish --clean
      - name: Collect release assets
        shell: bash
        run: |
          mkdir release
          jq -r '.[] | select(.extra.Format == "binary" or .type == "Checksum") | "\(.path)\t\(.name)"' dist/artifacts.json |
            while IFS=$'\t' read -r src name; do
              cp "$src" "release/$name"
            done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
